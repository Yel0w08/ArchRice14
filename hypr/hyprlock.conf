# hyprlock -- Hyprland's own screen locker.
#
# Bind: SUPER + SHIFT + L   (vars.kbSwaylock in ~/.config/hypr/variables.lua)
#       SUPER + L           locks with Noctalia's own lock screen instead.
#
# Design: flat opaque background covering the whole screen -- no wallpaper, no
# screenshot, no blur, nothing from the desktop is ever visible. On top of that
# sits a clock, date, user/host, and a styled password box.
#
# IMPORTANT: hyprlock exits with an error if it cannot find a config file, and
# the session is then left UNLOCKED. This file must exist for the bind to be
# safe. That is why the keybind refuses to start hyprlock if this file is
# missing (see keybinds.lua).
#
# --- Colour syntax -------------------------------------------------------
# hyprlock uses rgb(r, g, b) or rgba(r, g, b, a) with DECIMAL components and
# 0.0-1.0 alpha. Hex must be converted. All values below come from
# ~/.config/hypr/scheme/current.lua, so the lock screen tracks the desktop theme:
#   131317  19, 19, 23     background / surface
#   0e0e12  14, 14, 18     surfaceContainerLowest
#   201f23  32, 31, 35     surfaceContainer
#   353438  53, 52, 56     surfaceContainerHighest
#   e5e1e7  229, 225, 231  onSurface (main text)
#   c8c5d1  200, 197, 209  onSurfaceVariant (dimmed text)
#   c2c1ff  194, 193, 255  primary (accent)
#   c6c4e0  198, 196, 224  secondary
#   f5b2e0  245, 178, 224  tertiary
#   ffb4ab  255, 180, 171  error
#
# Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

## --- General -------------------------------------------------------------
general {
    # Hide the pointer: nothing on screen should suggest the desktop underneath.
    hide_cursor = true
}

# A soft fade in/out keeps the lock from snapping into place. Short, so it never
# delays the lock actually taking effect.
animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

## --- Background ----------------------------------------------------------
# No `path` and no `blur_passes` on purpose. A background block with only a
# colour renders a flat opaque fill and never reads any image, so there is
# nothing to leak onto the lock screen and nothing to blur.
#
# `monitor =` with no value means "all monitors".
background {
    monitor =
    color = rgb(19, 19, 23)
}

## --- Clock ---------------------------------------------------------------
# Big, centred, accent-tinted. $TIME is built in; the date uses cmd[] with an
# update interval so it does not re-run continuously.
label {
    monitor =
    text = $TIME
    font_family = Iosevka Nerd Font
    font_size = 110
    color = rgb(194, 193, 255)

    position = 0, 210
    halign = center
    valign = center
}

label {
    monitor =
    # update every 60s -- the date only changes once a day, but 60s keeps the
    # weekday wording correct across midnight without hammering `date`.
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_family = Iosevka Nerd Font
    font_size = 20
    color = rgb(200, 197, 209)

    position = 0, 130
    halign = center
    valign = center
}

## --- User / host ---------------------------------------------------------
# $USER is substituted by hyprlock itself. There is NO $(...) substitution, so
# the hostname is fetched with cmd[] and a long update interval (it never
# changes, so re-running it constantly would be pointless).
label {
    monitor =
    text = cmd[update:3600000] echo "$USER@$(hostname)"
    font_family = Iosevka Nerd Font
    font_size = 16
    color = rgb(200, 197, 209)

    position = 0, -140
    halign = center
    valign = center
}

## --- Password field ------------------------------------------------------
# Styled panel: opaque dark fill so it reads as a deliberate box, with an accent
# outline that changes colour on focus / verifying / failure.
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2

    position = 0, -50
    halign = center
    valign = center

    inner_color = rgba(32, 31, 35, 0.85)
    outer_color = rgb(53, 52, 56)

    font_color = rgb(229, 225, 231)
    font_family = Iosevka Nerd Font

    # NOTE: input-field has no `font_size`. That key only exists on `label`.
    # The password text size is controlled by `dots_size` below instead.

    # Accent while focused and while verifying, error red on failure.
    check_color = rgb(194, 193, 255)
    fail_color = rgb(255, 180, 171)
    capslock_color = rgb(245, 178, 224)

    rounding = 8

    placeholder_text = <span foreground="##c8c5d1">Enter password</span>
    # Only $FAIL / $PAMFAIL exist as substitution variables for failure text;
    # there is no $ATTEMPTS, so the bare PAM message is used on its own.
    fail_text = <i><span foreground="##ffb4ab">$FAIL</span></i>

    # Show how many characters have been typed, as centred dots.
    dots_center = true
    dots_size = 0.35
    dots_spacing = 0.35
    dots_rounding = -1
}

## --- Hint ----------------------------------------------------------------
# Small reminder of the two lock keybinds. Remove this block if you would rather
# the screen stay completely bare apart from the clock and password box.
label {
    monitor =
    text = <span foreground="##918f9a">SUPER + SHIFT + L: hyprlock    SUPER + L: Noctalia</span>
    font_family = Iosevka Nerd Font
    font_size = 12
    color = rgb(145, 143, 154)

    position = 0, 40
    halign = center
    valign = bottom
}
